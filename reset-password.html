<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | PrepLedger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <main class="auth-card">
        <h2 class="auth-heading">Reset your password</h2>
        <p>Choose a <span>new password</span> for your PrepLedger account.</p>

        <form id="reset-password-form">
            <div class="form-group">
                <label for="password">New password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm new password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <p id="form-message" class="form-error" hidden></p>

            <button type="submit" class="auth-submit">
                Reset password
            </button>
        </form>

        <p class="auth-footer">
            Remembered your password?
            <a href="index.html">Go back</a>
        </p>
    </main>

    <script>
        const form = document.getElementById("reset-password-form");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirm-password");
        const message = document.getElementById("form-message");

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
            message.textContent = "This reset link is invalid or missing its token.";
            message.hidden = false;
            form.querySelector("button").disabled = true;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.hidden = true;

            if (passwordInput.value !== confirmPasswordInput.value) {
                message.textContent = "Passwords do not match.";
                message.hidden = false;
                return;
            }

            if (passwordInput.value.length < 8) {
                message.textContent = "Password must be at least 8 characters.";
                message.hidden = false;
                return;
            }

            try {
                const response = await fetch(
                    "https://prepledger-server-production.up.railway.app/auth/reset-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token: token,
                            password: passwordInput.value
                        })
                    }
                );

                const result = await response.text();

                if (!response.ok) {
                    throw new Error(result || "Unable to reset password.");
                }

                message.className = "form-success";
                message.textContent = "Password reset successfully! You can now log in through the PrepLedger app.";
                message.hidden = false;
                form.querySelector("button").disabled = true;

            } catch (error) {
                message.className = "form-error";
                message.textContent = error.message || "Something went wrong. Please try again.";
                message.hidden = false;
            }
        });
    </script>

</body>
</html>
