<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password — PrepLedger</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="header-placeholder"></div>
    <script src="js/include.js"></script>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-heading">
                <h2>Forgot your <span>password?</span></h2>
                <p>
                    Enter the email associated with your
                    account and we'll help you <span>get back in.</span>
                </p>
            </div>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <p id="form-message" role="status" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary auth-submit">
                    Send reset link
                </button>
            </form>

            <div class="auth-footer">
                <p>
                    Don't have an account?
                    <a href="register.html">Create one here</a>
                </p>
            </div>

        </section>
    </main>

    <script>
        const form = document.getElementById("forgot-password-form");
        const emailInput = document.getElementById("email");
        const message = document.getElementById("form-message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.hidden = true;

            try {
                const response = await fetch(
                    "https://prepledger-server-production.up.railway.app/auth/forgot-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: emailInput.value.trim()
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error("Unable to process your request. Please try again.");
                }

                message.className = "form-success";
                message.textContent =
                    "If an account exists for that email, a reset link will be sent.";
                message.hidden = false;
                form.querySelector("button").disabled = true;

            } catch (error) {
                message.className = "form-error";
                message.textContent =
                    "Something went wrong. Please try again later.";
                message.hidden = false;
            }
        });
    </script>

</body>
</html>
