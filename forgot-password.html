```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password — PrepLedger</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="header-placeholder"></div>
    <script src="js/include.js"></script>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-heading">
                <h2>Forgot your <span>password?</span></h2>
                <p>
                    Enter the email associated with your
                    account and we'll help you <span>get back in.</span>
                </p>
            </div>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <p id="form-message" role="status" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary auth-submit">
                    Send reset link
                </button>
            </form>

            <div class="auth-footer">
                <p>
                    Don't have an account?
                    <a href="register.html">Create one here</a>
                </p>
            </div>

        </section>
    </main>

    <script>
        const form = document.getElementById('forgot-password-form');
        const message = document.getElementById('form-message');

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            message.textContent =
                'Password reset is not connected to the server yet.';
            message.className = '';
        });
    </script>

</body>
</html>
```
